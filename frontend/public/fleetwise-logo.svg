<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 90" fill="none">
  <defs>
    <linearGradient id="logo-blue-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0878F9" />
      <stop offset="60%" stop-color="#0878F9" />
      <stop offset="100%" stop-color="#12C9F4" />
    </linearGradient>
    <linearGradient id="logo-cyan-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0878F9" />
      <stop offset="40%" stop-color="#12C9F4" />
      <stop offset="100%" stop-color="#12C9F4" />
    </linearGradient>
    <filter id="logo-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#12C9F4" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Group: Icon Mark (x: 0 to 75) -->
  <g transform="translate(6, 4) scale(0.85)">
    <!-- Speed Dash Trails -->
    <line x1="8" y1="36" x2="26" y2="36" stroke="#12C9F4" stroke-width="3.5" stroke-linecap="round" opacity="0.6" />
    <line x1="4" y1="52" x2="22" y2="52" stroke="#12C9F4" stroke-width="3.5" stroke-linecap="round" opacity="0.75" />
    <line x1="12" y1="68" x2="26" y2="68" stroke="#0878F9" stroke-width="3.5" stroke-linecap="round" opacity="0.8" />

    <!-- Top Arrow Wing -->
    <path d="M22 80V48C22 34 32 26 48 26H78M78 26L67 15M78 26L67 37" 
          stroke="url(#logo-blue-cyan)" 
          stroke-width="7.5" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          filter="url(#logo-glow)" />

    <!-- Middle Arrow Wing -->
    <path d="M28 78V56C28 47 34 44 46 44H68M68 44L59 35M68 44L59 53" 
          stroke="url(#logo-cyan-blue)" 
          stroke-width="7.5" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          filter="url(#logo-glow)" />

    <!-- Lower Stems -->
    <line x1="22" y1="68" x2="22" y2="82" stroke="#0878F9" stroke-width="7" stroke-linecap="round" />
    <line x1="30" y1="68" x2="30" y2="78" stroke="#12C9F4" stroke-width="5" stroke-linecap="round" />
  </g>

  <!-- Typography: Wordmark "FleetWise" -->
  <text x="96" y="52" font-family="system-ui, -apple-system, 'Inter', sans-serif" font-size="38" font-weight="800" letter-spacing="-0.5px">
    <tspan fill="#FFFFFF">Fleet</tspan>
    <tspan fill="#12C9F4">Wise</tspan>
  </text>

  <!-- Typography: Subtitle "SMART FLEET · EFFICIENT DELIVERIES" -->
  <text x="98" y="72" font-family="system-ui, -apple-system, 'Inter', sans-serif" font-size="9" font-weight="700" letter-spacing="2.5px" fill="#94A3B8">
    SMART FLEET <tspan fill="#12C9F4">·</tspan> EFFICIENT DELIVERIES
  </text>
</svg>
