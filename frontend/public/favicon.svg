<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="fw-blue-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0878F9" />
      <stop offset="100%" stop-color="#12C9F4" />
    </linearGradient>
    <linearGradient id="fw-cyan-blue" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#12C9F4" />
      <stop offset="100%" stop-color="#0878F9" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Speed trails -->
  <path d="M6 21H18M4 31H14M8 41H16" stroke="#12C9F4" stroke-width="2.5" stroke-linecap="round" opacity="0.75" />

  <!-- Dynamic F Form: Top Arrow Wing -->
  <path d="M14 50V35C14 23 20 17 32 17H46L41 12M46 17L41 22" 
        stroke="url(#fw-blue-cyan)" 
        stroke-width="5" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#glow)" />

  <!-- Dynamic F Form: Middle Arrow Wing -->
  <path d="M18 48V37C18 31 22 29 28 29H40L35 24M40 29L35 34" 
        stroke="url(#fw-cyan-blue)" 
        stroke-width="5" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#glow)" />

  <!-- Lower Anchor Fin -->
  <path d="M14 44L14 54M20 42L20 50" stroke="#0878F9" stroke-width="4" stroke-linecap="round" />
</svg>
